<section>
    <div class="row">
        <div class="col-xl-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <i class="bi bi-table me-2"></i>
                    <h4 class="mb-0 fw-lighter flex-grow-1">DataTable Example</h4>
                    <button class="btn btn-outline-success me-2" data-bsnippet="btn-view" type="button" role="button"><i class="bi bi-eye"></i></button>
                    <button class="btn btn-outline-primary me-2" data-bsnippet="btn-bookmark" type="button" role="button"><i class="bi bi-bookmark"></i></button>
                    <button class="btn btn-outline-danger me-2" data-bsnippet="btn-delete" type="button" role="button"><i class="bi bi-trash"></i></button>
                </div>
                <div class="card-body table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">First</th>
                                <th scope="col">Last</th>
                                <th scope="col">Handle</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">1</th>
                                <td>Mark</td>
                                <td>Otto</td>
                                <td>@mdo</td>
                            </tr>
                            <tr>
                                <th scope="row">2</th>
                                <td>Jacob</td>
                                <td>Thornton</td>
                                <td>@fat</td>
                            </tr>
                            <tr>
                                <th scope="row">3</th>
                                <td colspan="2">Larry the Bird</td>
                                <td>@twitter</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                    <div class="text-muted">
                        Showing
                        <strong>1 to 10</strong>
                        of
                        <strong>57</strong>
                        entries
                    </div>
                    <div class="card-footer-btn-group d-flex flex-wrap gap-2">
                        <!-- Export Data Action-->
                        <button class="btn btn-outline-secondary" type="button" title="Export Table">
                            <i class="bi bi-download"></i>
                            Export
                        </button>
                        <!-- Column Visibility Toggle Settings-->
                        <button class="btn btn-outline-secondary" type="button" title="Filter Columns">
                            <i class="bi bi-sliders"></i>
                            Columns
                        </button>
                        <!-- Primary Creation Action-->
                        <button class="btn btn-primary" type="button">
                            <i class="bi bi-plus-lg"></i>
                            Add New Record
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
