<div class="row">
    <div class="col-xl-6">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <i class="bi bi-graph-up me-2"></i>
                <h4 class="mb-0 fw-lighter flex-grow-1">Recent Activity</h4>
                <div class="card-header-btn-group">
                    <button class="btn btn-outline-primary me-2" data-bsnippet="btn-bookmark" type="button" role="button"><i class="bi bi-bookmark"></i></button>
                    <button class="btn btn-outline-danger me-2" data-bsnippet="btn-delete" type="button" role="button"><i class="bi bi-trash"></i></button>
                </div>
            </div>
            <div class="card-body">
                <canvas id="myAreaChart" width="100%" height="40"></canvas>
            </div>
        </div>
    </div>
    <div class="col-xl-6">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <i class="bi bi-bar-chart-fill me-2"></i>
                <h4 class="mb-0 fw-lighter flex-grow-1">Bar Chart Example</h4>
                <div class="card-header-btn-group">
                    <button class="btn btn-outline-primary me-2" data-bsnippet="btn-bookmark" type="button" role="button"><i class="bi bi-bookmark"></i></button>
                    <button class="btn btn-outline-danger me-2" data-bsnippet="btn-delete" type="button" role="button"><i class="bi bi-trash"></i></button>
                </div>
            </div>
            <div class="card-body">
                <canvas id="myBarChart" width="100%" height="40"></canvas>
            </div>
        </div>
    </div>
</div>
